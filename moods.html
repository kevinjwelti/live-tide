<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="live-tide-build" content="moods-v49" />
    <title>LIVE TIDE · Moods</title>
    <link rel="icon" href="/live-tide/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Playfair+Display:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="moods-bar">
      <div>
        <p class="moods-kicker">The Boom · preview</p>
        <h1>Eight daily moods</h1>
      </div>
      <div class="sky-controls" role="group" aria-label="Simulated time of day">
        <button type="button" data-sky="now">Now</button>
        <button type="button" data-sky="noon">Noon</button>
        <button type="button" data-sky="dusk">Dusk</button>
        <button type="button" data-sky="night">Night</button>
      </div>
    </header>
    <main id="mood-grid" class="mood-grid"></main>
    <script type="module" src="./src/moods-preview.js"></script>
  </body>
</html>
