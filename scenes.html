<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="live-tide-build" content="moods-v93" />
    <title>LIVE TIDE · Scenes</title>
    <link rel="icon" href="/live-tide/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Playfair+Display:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --cream: #f3ead8;
        --gold: #d4b56a;
        --serif: "Playfair Display", Palatino, Georgia, serif;
        --sans: "Outfit", "Avenir Next", "Helvetica Neue", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #10161c;
        color: var(--cream);
        font-family: var(--sans);
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        padding: max(1.1rem, env(safe-area-inset-top)) max(1.2rem, env(safe-area-inset-right)) max(0.8rem, env(safe-area-inset-bottom)) max(1.2rem, env(safe-area-inset-left));
      }
      a { color: inherit; }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 1rem;
        margin-bottom: 0.9rem;
        flex: none;
      }
      .back {
        font-size: 0.78rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-decoration: none;
      }
      h1 {
        margin: 0.25rem 0 0;
        font-family: var(--serif);
        font-weight: 500;
        font-size: clamp(2rem, 4vw, 3.2rem);
      }
      .lede {
        margin: 0.35rem 0 0;
        max-width: 36rem;
        color: rgba(243, 234, 216, 0.72);
        font-size: 1rem;
        line-height: 1.4;
      }
      .scene-list {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 0.8rem;
      }
      .scene-link {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        min-height: 0;
        height: 100%;
        padding: 0.4rem;
        border-radius: 0.7rem;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.03);
      }
      .scene-link:hover,
      .scene-link:focus-visible {
        background: rgba(255, 255, 255, 0.08);
      }
      .scene-link:focus-visible {
        outline: 2px solid var(--cream);
        outline-offset: 3px;
      }
      .scene-thumb {
        display: block;
        flex: 1;
        min-height: 0;
        border-radius: 0.45rem;
        background: #143044 center / cover no-repeat;
        overflow: hidden;
        position: relative;
      }
      .scene-thumb.is-split {
        display: grid;
        grid-template-columns: 1.35fr 0.85fr;
        background: none;
      }
      .scene-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .scene-thumb.is-classic {
        background: linear-gradient(#d7ecf6, #7eb6d4 38%, #1d6c98 68%, #0c4d78);
      }
      .scene-thumb svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .scene-title {
        font-family: var(--serif);
        font-size: 1.35rem;
        padding: 0.15rem 0.25rem 0.35rem;
      }
      @media (max-width: 900px) {
        body { height: auto; overflow: auto; }
        .scene-list {
          flex: none;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          grid-template-rows: none;
        }
        .scene-link { height: auto; }
        .scene-thumb { flex: none; aspect-ratio: 16 / 9; }
      }
      @media (max-width: 560px) {
        .scene-list { grid-template-columns: 1fr; }
      }
    </style>
    <script type="module" crossorigin src="/live-tide/assets/scenes-JwBYCvak.js"></script>
    <link rel="modulepreload" crossorigin href="/live-tide/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/live-tide/assets/scenes-D80dAU8v.js">
  </head>
  <body>
    <header class="bar">
      <div>
        <a class="back" href="./">Live Tide</a>
        <h1>Scenes</h1>
        <p class="lede">Each shore opens full screen. The lagoon is the one the page uses when nothing else is chosen.</p>
      </div>
    </header>
    <main id="scene-list" class="scene-list"></main>
  </body>
</html>
